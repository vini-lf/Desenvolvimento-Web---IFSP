<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        window.onload = main;

	function main() {
	    let elemento = document.getElementById('para');
	    let atual = 19
        let anos = 7
        let resultado = atual + anos
        elemento.innerHTML = resultado
	}
    </script>
</head>
<body>
    <h1>Uma página HTML.</h1>
    <p id="para">Com JS rodando.</p>
</body>
</html>
