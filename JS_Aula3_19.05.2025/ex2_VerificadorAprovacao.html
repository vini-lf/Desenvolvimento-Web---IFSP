<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Aprovação</title>
    <script>
        function verificarNota() {
            let notaInput = document.getElementById("nota");
            let resultadoDiv = document.getElementById("resultado");
            let notaTexto = notaInput.value;
            let nota = parseFloat(notaTexto);

            if (isNaN(nota)) {
                resultadoDiv.textContent = "Por favor, digite um valor numérico válido.";
                return;
            }

            if (nota < 6) {
                resultadoDiv.textContent = "Reprovado";
            } else {
                resultadoDiv.textContent = "Aprovado";
            }
        }
    </script>
</head>
<body>
    <h1>Verificador de Aprovação</h1>
    <label for="nota">Digite a nota:</label>
    <input type="text" id="nota"><br><br>
    <button onclick="verificarNota()">Verificar</button>
    <div id="resultado"></div>
</body>
</html>
